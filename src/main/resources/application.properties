spring.application.name=userstack

# 設定 JSP 視圖解析器 (View Resolver)
# 告訴 Spring Boot：當 Controller 回傳邏輯視圖名稱（如 "index"）時，
# 它應該去哪裡找對應的 .jsp 檔案。
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 資料庫連線設定
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=UserStackDB;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=ENC(WjB+iEZ5zpE6Nk+Fd8xhQYHMVbeIhLXLkQyqi+yJnBBd44xeNW+dXzD5oXHOwZRo)
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 設定 Session 的最大非作用時間
server.servlet.session.timeout=3m

# 安全路徑過濾設定 (多個路徑以分號分隔)
security.protected-paths=/products

# -------------------------------------------------------
# Logging 設定
# 原因：專案路徑含空格與中文字，導致 Tomcat StandardJarScanner
#       在開發期以 URL 協定掃描 WAR 內 JAR 時產生 NoSuchFileException WARN。
#       此為已知無害問題，將其日誌等級提升至 ERROR 以消除雜訊。
# -------------------------------------------------------
logging.level.org.apache.tomcat.util.scan.StandardJarScanner=ERROR